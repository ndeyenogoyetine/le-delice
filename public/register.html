<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un compte | Le Délice</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/reservation.css">
    <link rel="stylesheet" href="css/responsive.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

<header>
    <nav class="navbar">
        <div class="menu-toggle"><i class="fas fa-bars"></i></div>
        <a href="index.html" class="logo">
            <img src="images/logo.png" alt="Logo Le Délice">
            <span>Le Délice</span>
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Accueil</a></li>
            <li><a href="apropos.html">À propos</a></li>
            <li><a href="specialites.html">Nos spécialités</a></li>
            <li><a href="galerie.html">Galerie</a></li>
            <li><a href="temoignages.html">Témoignages</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="reservation.html">Réservation</a></li>
            <li id="nav-auth"></li>
        </ul>
        <a href="reservation.html" class="btn-reserver">Réserver</a>
    </nav>
</header>

<section class="reservation">
    <div class="reservation-container">
        <form class="reservation-form" id="registerForm">
            <h2>Créer un compte</h2>

            <p id="formError" class="form-error" style="display:none;"></p>

            <input type="text" id="name" placeholder="Nom complet" required>
            <input type="email" id="email" placeholder="Adresse email" required>
            <input type="tel" id="phone" placeholder="Téléphone">
            <input type="password" id="password" placeholder="Mot de passe (6 caractères min.)" required minlength="6">

            <button type="submit" class="btn-menu">Créer mon compte</button>

            <p class="form-switch">
                Déjà un compte ? <a href="login.html">Se connecter</a>
            </p>
        </form>
    </div>
</section>

<script src="js/script.js"></script>
<script src="js/auth.js"></script>
<script>
document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById("formError");
    errorBox.style.display = "none";

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const phone = document.getElementById("phone").value;
    const password = document.getElementById("password").value;

    try {
        const res = await fetch("/api/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, email, phone, password }),
        });
        const data = await res.json();

        if (!res.ok) {
            errorBox.textContent = data.error || "Erreur lors de la création du compte.";
            errorBox.style.display = "block";
            return;
        }

        const params = new URLSearchParams(window.location.search);
        window.location.href = params.get("redirect") || "index.html";
    } catch (err) {
        errorBox.textContent = "Impossible de contacter le serveur.";
        errorBox.style.display = "block";
    }
});
</script>

</body>
</html>
